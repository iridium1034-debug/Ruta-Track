name: Build Ruta Track APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Preparar Android y generar APK
        run: npm run android:apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaTrack-instalable
          path: RutaTrack-instalable.apk
